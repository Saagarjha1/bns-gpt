[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bns-gpt"
version = "0.1.0"
description = "BNS Legal AI RAG System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "pinecone-client>=3.0.0",
    "groq>=0.4.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0"
]

[tool.vercel]
entrypoint = "api.index:app"
